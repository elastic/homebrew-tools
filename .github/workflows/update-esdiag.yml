name: Update ESDiag

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Stable ESDiag version; leave empty to use the latest release
        required: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check update readiness
        id: readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          skip=false
          if [[ "$EVENT_NAME" == "schedule" && ! -f Formula/esdiag.rb ]]; then
            echo "Waiting for the first manually selected native ESDiag release"
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release
        if: steps.readiness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(gh release view --repo elastic/esdiag --json tagName --jq .tagName)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable ESDiag version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render and verify formula
        if: steps.readiness.outputs.skip != 'true'
        run: scripts/update-esdiag.sh "${{ steps.release.outputs.version }}"

      - name: Open update pull request
        if: steps.readiness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ -z "$(git status --porcelain -- Formula/esdiag.rb)" ]]; then
            echo "Formula already matches ESDiag $VERSION"
            exit 0
          fi

          branch="automation/esdiag-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Formula/esdiag.rb
          git commit -m "esdiag $VERSION"
          git push --force-with-lease origin "$branch"

          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "esdiag $VERSION" \
              --body "Update the ESDiag formula to the verified $VERSION release artifacts."
          fi

          # Pull requests created with GITHUB_TOKEN do not emit another
          # pull_request workflow event, so dispatch the checks explicitly.
          gh workflow run tests.yml --ref "$branch"
