name: Update ESDiag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable ESDiag version
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable ESDiag version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Render and verify formula
        run: scripts/update-esdiag.sh "${{ steps.release.outputs.version }}"

      - name: Open update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ -z "$(git status --porcelain -- Formula/esdiag.rb)" ]]; then
            echo "Formula already matches ESDiag $VERSION"
            exit 0
          fi

          branch="automation/esdiag-$VERSION"
          if gh pr view "$branch" --json state --jq '.state == "OPEN"' | grep -qx true; then
            echo "An update pull request for ESDiag $VERSION is already open"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Remote branch $branch already exists without an open pull request" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Formula/esdiag.rb
          git commit -m "esdiag $VERSION"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "esdiag $VERSION" \
            --body "Update the ESDiag formula to the verified $VERSION release artifacts."
